version: v1.0

plan: standard-2

paths:
  - src/**
  - index.js
  - .scripts/**
  - .neetoci/default.yml
  - package.json
  - yarn.lock
  - .node-version
  - .nvmrc
  - .eslintignore
  - .eslintrc.js
  - .prettierignore
  - .prettierrc.js
  - jsconfig.json
  - "*.config.*"

global_job_config:
  setup:
    - checkout
    - neetoci-version node 22.13
    - cache restore
    - yarn install
    - cache store
  jobs:
    - name: CiChecks
      commands:
        - .scripts/run_eslint_on_modified_files.sh
        - yarn test

triggers:
  - event: branch
    branch_name: main
  - event: pull_request
